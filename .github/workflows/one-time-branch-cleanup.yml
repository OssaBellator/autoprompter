name: One-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run one-time branch cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-default branches and remove this workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const workflowPath = ".github/workflows/one-time-branch-cleanup.yml";
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100
            });
            const failures = [];

            for (const branch of branches) {
              if (branch.name === defaultBranch) continue;
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                });
                core.info(`Deleted branch ${branch.name}`);
              } catch (error) {
                failures.push(`${branch.name}: ${error.message}`);
                core.warning(`Could not delete ${branch.name}: ${error.message}`);
              }
            }

            try {
              const file = await github.rest.repos.getContent({
                owner,
                repo,
                path: workflowPath,
                ref: defaultBranch
              });
              await github.rest.repos.deleteFile({
                owner,
                repo,
                path: workflowPath,
                message: "Remove one-time branch cleanup workflow",
                sha: file.data.sha,
                branch: defaultBranch
              });
              core.info("Removed the one-time cleanup workflow from main");
            } catch (error) {
              failures.push(`self-removal: ${error.message}`);
              core.warning(`Could not remove the cleanup workflow: ${error.message}`);
            }

            if (failures.length) {
              core.setFailed(`Branch cleanup completed with failures:\n${failures.join("\n")}`);
            }
