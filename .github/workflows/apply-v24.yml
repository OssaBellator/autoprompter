name: Apply AutoPrompter 2.4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/concurrent-chat-workers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/concurrent-chat-workers
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .release/v24/part-*.txt > /tmp/v24.patch.gz.b64
          base64 -d /tmp/v24.patch.gz.b64 | gzip -d > /tmp/v24.patch
          echo '72f16b0783ce3e027c0b222775559b4d46eca6e5f65a585ffe594d47f96d489b  /tmp/v24.patch' | sha256sum -c -
          git apply --check /tmp/v24.patch
          git apply /tmp/v24.patch
      - name: Validate concurrent release
        shell: bash
        run: |
          npm test
          npm run check
          python -m json.tool manifest.json >/dev/null
          python -m json.tool package.json >/dev/null
          echo '0a034fcd5121d5df9fef9893661520245f20131a9cb6b628c54b8c6329c4be78  background.js' | sha256sum -c -
          echo 'ae538b2c00c4a1333484233cec22a7b7f02fcfc8ff0ad3e98afccb0a80f02a19  popup.js' | sha256sum -c -
          echo '4ab5e25d1ea6b8d38bd2854b86d99f9403eefe956fd428eb4b11ed26293a1135  content.js' | sha256sum -c -
      - name: Commit validated source
        shell: bash
        run: |
          rm -rf .release/v24 .github/workflows/apply-v24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release AutoPrompter 2.4 with concurrent chat workers'
          git push origin HEAD:agent/concurrent-chat-workers
