name: Remove merged feature branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Remove merged feature branches'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged branches
        uses: actions/github-script@v7
        with:
          script: |
            const refs = [
              'heads/feat/autocontinue-project-folders',
              'heads/fix/resume-stage-button'
            ];
            for (const ref of refs) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref
                });
                core.info(`Deleted ${ref}`);
              } catch (error) {
                if (error.status !== 422 && error.status !== 404) throw error;
                core.info(`${ref} was already absent`);
              }
            }
