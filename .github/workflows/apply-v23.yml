name: Apply AutoPrompter 2.3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/circuit-breaker-toggle-draft-persistence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/circuit-breaker-toggle-draft-persistence
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply validated patch
        shell: bash
        run: |
          base64 -d .github/v23.patch.gz.b64 | gzip -d > /tmp/v23.patch
          echo '7bd989d7cfe592fc45757ebbdc91dec21ecfce036daeb71346554306f7d1a17e  /tmp/v23.patch' | sha256sum -c -
          git apply --check /tmp/v23.patch
          git apply /tmp/v23.patch
      - name: Validate
        run: |
          npm test
          npm run check
          python -m json.tool manifest.json >/dev/null
          python -m json.tool package.json >/dev/null
      - name: Commit release
        shell: bash
        run: |
          rm -f .github/v23.patch.gz.b64 .github/workflows/apply-v23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AutoPrompter 2.3 with circuit-breaker toggle"
          git push origin HEAD:agent/circuit-breaker-toggle-draft-persistence
