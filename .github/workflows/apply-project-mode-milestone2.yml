name: Apply Project Mode milestone 2

on:
  push:
    branches:
      - agent/web-first-multi-agent-project-mode
    paths:
      - '.release-project-mode/**'
      - '.github/workflows/apply-project-mode-milestone2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-first-multi-agent-project-mode
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release-project-mode/m2.part* | base64 --decode > /tmp/m2.patch.gz
          echo 'f7a99c1faf8480a505f8fc66bff7a571c68d3acbf6597dc138a37fa47b91abef  /tmp/m2.patch.gz' | sha256sum -c -
          gzip -dc /tmp/m2.patch.gz > /tmp/m2.patch
          echo '50c6d50c90bbfcbe095407c9db0e9f7a22089cb1a1223a313d3f9fa37d3b7ce9  /tmp/m2.patch' | sha256sum -c -
          git apply --check /tmp/m2.patch
          git apply /tmp/m2.patch
      - name: Validate milestone
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          node -e "for (const f of ['manifest.json','package.json','schemas/project.schema.json','schemas/plan.schema.json','schemas/task.schema.json','schemas/result.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          git diff --check
          cat > /tmp/expected-blobs <<'EOF'
          7f0180a1feb1c511e2ceb0a1a83663454939ca6b README.md
          baa6a3c9072b897ead35dd2026f457d631cf9ced background.js
          afac11a31c837490b50a6abfc6ceaa6628fed39e docs/RFC-001-WEB-FIRST-MULTI_AGENT_RUNTIME.md
          7a66b64abca0d186fa49c3137e3542fc1eee75b5 package.json
          26de9c130526c0c7b2020ea8ecd6db7e7b37ab7f popup.css
          315372d180438b986f5949956ce05c53f4aa63c3 popup.html
          18040ad1d7b77bb77a1e3058af00a0016f332375 popup.js
          4835b898b8583f7696310219b6b45ccdb27d4ea2 project-store.js
          76b38c32934e87223f25dfa21ba3027768a669de tests/popup-source.test.js
          004b99db9c5e68b23f962add38da372f5ba634b5 tests/project-runtime.test.js
          02540177ab899976b05653b6d25173bfd64360b6 tests/project-store.test.js
          EOF
          while read -r expected file; do
            actual=$(git hash-object "$file")
            test "$actual" = "$expected" || { echo "$file: expected $expected, got $actual"; exit 1; }
          done < /tmp/expected-blobs
      - name: Commit validated milestone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-project-mode
          rm -f .github/workflows/apply-project-mode-milestone2.yml .project-mode-m2-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement extension-local Project Mode store'
          git push origin HEAD:agent/web-first-multi-agent-project-mode
