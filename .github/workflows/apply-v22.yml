name: Apply AutoPrompter 2.2

on:
  push:
    branches:
      - agent/per-chat-continuity-init
    paths:
      - .github/workflows/apply-v22.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/per-chat-continuity-init
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply tested patch
        shell: bash
        run: |
          cat > /tmp/v22.patch.gz.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/v22.patch.gz.b64 | gzip -d > /tmp/v22.patch
          patch -p1 < /tmp/v22.patch
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Commit validated release
        shell: bash
        run: |
          rm -f .github/workflows/apply-v22.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AutoPrompter 2.2 with per-chat continuity"
          git push origin HEAD:agent/per-chat-continuity-init
