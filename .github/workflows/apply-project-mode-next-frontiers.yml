name: Apply Project Mode next frontiers

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.next-frontiers-trigger'
      - '.github/workflows/apply-project-mode-next-frontiers.yml'

permissions:
  contents: write

concurrency:
  group: project-mode-next-frontiers
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/web-first-multi-agent-project-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-first-multi-agent-project-mode
          fetch-depth: 0

      - name: Reconstruct verified patches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .next-frontiers-trigger
          fetch_blobs() {
            local output="$1"
            shift
            : > "$output"
            local index=0
            for sha in "$@"; do
              local part
              part=$(printf '/tmp/frontier-part-%03d' "$index")
              python - "$sha" "$part" <<'PY'
          import base64, json, os, sys, urllib.request
          sha, output = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs/{sha}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          data = base64.b64decode(payload["content"])
          with open(output, "wb") as handle:
              handle.write(data)
          PY
              test "$(git hash-object "$part")" = "$sha"
              cat "$part" >> "$output"
              index=$((index + 1))
            done
          }

          fetch_blobs /tmp/modified.patch.gz.b64 \
            eae31b1b9ed525a69ec41a74f8522d405a2d232b \
            235c22172ed327fcdedce803c0ff59a4241600c4 \
            98e4c3cfb1fdc2fb75f895d2fd0a6f1949c783a7 \
            ad3a4c1429121604d96216ffa6437dacbd5a8112 \
            71ef4eff6b9f054d21ff08920bed4d2ef7872eab \
            7448a1205a7ac34ca883596e02ccd8f9c9311af5 \
            c77b7362960a9933580fea1a7397ff2bb25d7004 \
            6f59ca84570055bf3026777b12ddaa6c6b1c4039 \
            8e670e77d6a1d76b8f5610b7ef8a7fe4ad9319df \
            5558259126cead40306ef56d6390f6ef88e78a1f \
            d6a2c4df33b64d2c26794de9a9168a64741ac7b7 \
            3719410380bc6ae43bae9a5f34eda8df4347c5f9 \
            a0caf7792befbf25a6c6917942508450be191b40 \
            54d86898eebae94b062cdc69a1326d47f7084a75 \
            c9dcccd7e99a4a6c6843662870dd0b30a0cd5d0c \
            0809f5a0f4b56ef051f29239b87292c30a1a326a \
            64a83628d9bedd9d840c06feb0124ccbe02986ee \
            8fcd335fc1fd689e6d49144c692ea6cf62ab3846
          echo 'd1211111185420920ee83d0ef4ad45e2841946e7b6984299a4e11040f5ac10b4  /tmp/modified.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/modified.patch.gz.b64 > /tmp/modified.patch.gz
          echo '24780211ccec962e767c8865cd78d799291d80e74c397eab449e2c4e77621eb0  /tmp/modified.patch.gz' | sha256sum --check
          gzip -dc /tmp/modified.patch.gz > /tmp/modified.patch
          echo 'eda12987da98b489cf1f9fcacfa273e6d0e530296a3fe57f361477527802fd57  /tmp/modified.patch' | sha256sum --check

          fetch_blobs /tmp/new.patch.gz.b64 \
            7bc620d2238a04c5c760cba4a3202fab49ab3ab2 \
            db139519332287cb4e3350c03ea9656d08a5beb4 \
            a84eeb88b4767a79203e807e2065d36ee1c6b77a \
            1616fc13c7627b3aab7e259146e19e09f5d937e6 \
            4d6abe93b3e77e3881a3ae61070acb5dcc4217e1 \
            bd8501b79ba1c6014a56a8bc0a3422aac4ed2709 \
            d7d71d55bcd58b43b714be11146af8dcfd84224b \
            ea119a9c672474b16f16d505dc152a49208377f7
          echo 'dd50d219ee5cc6830e4de587862206069013244fbe8af4c9542744d2b53d4d1b  /tmp/new.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/new.patch.gz.b64 > /tmp/new.patch.gz
          echo 'afe3fc6a11bb984ad36440a2f08138ee960443bb9f11e56ef1654b0a63d4b23b  /tmp/new.patch.gz' | sha256sum --check
          gzip -dc /tmp/new.patch.gz > /tmp/new.patch
          echo '5af79ab7a394d8e5298b714206b7d7dfc62200ca510b79d6200ffcf33b317fcf  /tmp/new.patch' | sha256sum --check

      - name: Apply exact frontier source
        shell: bash
        run: |
          set -euo pipefail
          git apply --3way /tmp/modified.patch
          git apply /tmp/new.patch
          rm -f .github/workflows/export-project-mode-source.yml
          git diff --check

      - name: Validate runtime and protocols
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          python - <<'PY'
          import json
          from pathlib import Path
          for root in (Path('schemas'), Path('examples')):
              if not root.exists():
                  continue
              for path in root.rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
          PY
          grep -q 'STORE_SCHEMA_VERSION = "1.6"' project-store.js
          grep -q 'INTEGRATION_SCHEMA_VERSION = "1.1"' integration-protocol.js
          grep -q 'ACTIVE_GENERATION_HEARTBEAT_MS' content.js
          grep -q 'STATUS_HEARTBEAT_MS' content.js
          grep -q 'generationControlState' content.js
          grep -q 'RUN_PROJECT_SUCCESSOR_TASK' content.js
          grep -q 'GET_PROJECT_SELECTOR_HEALTH' background.js
          test -f approval-protocol.js
          test -f reconciliation-protocol.js

      - name: Verify exact source blobs
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done <<'EOF'
          06fc49fa1e12c7789a599f4a01be82eca4820b8f background.js
          d0ed92f369bb1e7213c00cfaa32ad2104d79c5a3 content.js
          c5de76c423d194bf896439d05246f47319a6cef2 integration-protocol.js
          2a35833c8678353f093942c820090ab4178fb154 package.json
          957f914296db333869f4ace3318cc97d08cb7a8b popup.css
          8174d3129b61822417697f6c471b386109fdb4d8 popup.html
          92f4c653eeef92cd5ecc68db2f8f2ded0ad3ddb6 popup.js
          a6f8f6a880719c5e34243c8cc3dbebda3b056704 project-store.js
          8a1ee9927cc413e1f1ffae1809e634f22097cea4 worker-protocol.js
          781b6e0e87ac9c972045fb0c5482ed02baffd96b approval-protocol.js
          e2cd7d333b562fa12201399538555b5a856fdba0 reconciliation-protocol.js
          4a984bdab64eabb066f81d19d075a4ba5c78aad1 schemas/dispatch.schema.json
          742bc5442aed005394379bd2cd16b15fb7e98f12 schemas/integration.schema.json
          cd79becbc8d7a3319f8aa7a304ef6aeb4f55f4f0 schemas/approval.schema.json
          4924a1e95e721abd741440c483c3419e49665be5 schemas/reconciliation.schema.json
          6ef0328bee34eab1bc11ff2deb4ad03aeb3b58d2 tests/content.test.js
          81d957500f3da87ce4ff36ebdff2d76ba496029e tests/frontier-protocols.test.js
          09403665693a3ab84ac1f3c62281bbc0b8cc5384 tests/project-review-flow.test.js
          1ff32133e0fe0d6e7790f1210673388d91a65509 tests/project-runtime.test.js
          0eb2bce363ef647e786ce7f1fad9f51bc081acaf tests/project-store.test.js
          6bae0128569b788368da977c5b8b0c695309eb4d tests/project-web-dispatch-source.test.js
          d7e0e4a40d6557893f6d2d84293ea75daadcd941 tests/project-next-frontiers.test.js
          EOF

      - name: Commit validated source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .next-frontiers-trigger
          rm -f .github/workflows/apply-project-mode-next-frontiers.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance Project Mode reliability and control frontiers'
          git push origin HEAD:agent/web-first-multi-agent-project-mode
