name: Export autonomous project bootstrap source

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/export-autonomous-project-bootstrap.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/autonomous-project-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/autonomous-project-bootstrap
      - name: Package source
        run: tar --exclude=.git -czf /tmp/autoprompter-autonomous-bootstrap-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: autoprompter-autonomous-bootstrap-source
          path: /tmp/autoprompter-autonomous-bootstrap-source.tar.gz
          if-no-files-found: error
          retention-days: 1
