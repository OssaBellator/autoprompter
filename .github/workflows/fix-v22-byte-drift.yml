name: Correct AutoPrompter 2.2 byte drift

on:
  pull_request:
    branches:
      - main
    paths:
      - .release-fix/READY

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'agent/per-chat-continuity-init'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/per-chat-continuity-init
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Correct verified chunk-boundary whitespace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'background.js': [
                  ('\n     return stopScheduler("Successor creation failed"', '\n    return stopScheduler("Successor creation failed"'),
              ],
              'content.js': [
                  ('return  button;', 'return button;'),
                  ('\n     signal,\n', '\n    signal,\n'),
                  ('\n         error: error?.message || String(error)\n', '\n        error: error?.message || String(error)\n'),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{filename}: expected one match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          test "$(git hash-object background.js)" = "866449d7f4d8163ffa297461ddaa77b5d7405744"
          test "$(git hash-object content.js)" = "048101059d37efabfab9aa2b1457d4908c02d165"
          test "$(git hash-object popup.js)" = "f876cef9e5e7da31423e17b4f6d5d64717105a7d"
      - name: Validate release
        run: |
          npm test
          npm run check
      - name: Commit exact validated runtime
        shell: bash
        run: |
          rm -rf .release-exact .release-fix
          rm -f .github/workflows/finalize-v22-exact.yml .github/workflows/fix-v22-byte-drift.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize exact tested AutoPrompter 2.2 runtime"
          git push origin HEAD:agent/per-chat-continuity-init
