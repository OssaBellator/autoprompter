name: Remove merged repair branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Remove merged repair branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged repair branch
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/fix/github-planner-resume'
              });
              core.info('Deleted fix/github-planner-resume');
            } catch (error) {
              if (error.status !== 422 && error.status !== 404) throw error;
              core.info('Merged repair branch was already absent');
            }
