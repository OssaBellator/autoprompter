name: Finalize AutoPrompter 2.1

on:
  push:
    branches: [agent/multi-chat-scheduler]
    paths: [parts/READY]

permissions:
  contents: write

jobs:
  reconstruct-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-chat-scheduler
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct release files
        shell: bash
        run: |
          set -euo pipefail
          cat parts/manifest.json.part* > manifest.json
          cat parts/background.js.part* > background.js
          cat parts/content.js.part* > content.js
          cat parts/popup.html.part* > popup.html
          cat parts/popup.css.part* > popup.css
          cat parts/popup.js.part* > popup.js
          cat parts/README.md.part* > README.md
          cat parts/package.json.part* > package.json
          mkdir -p tests docs .github/workflows
          cat parts/tests__background.test.js.part* > tests/background.test.js
          cat parts/tests__content.test.js.part* > tests/content.test.js
          cat parts/docs__MULTI_AGENT_ROADMAP.md.part* > docs/MULTI_AGENT_ROADMAP.md
          cat parts/.github__workflows__test.yml.part* > .github/workflows/test.yml
          cat parts/.gitignore.part* > .gitignore
          rm -rf parts
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Commit reconstructed release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize guarded continuity release"
          git push origin HEAD:agent/multi-chat-scheduler
