name: Apply AutoPrompter 2.8

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/synchronized-concurrent-submit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/synchronized-concurrent-submit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and apply release patches
        shell: bash
        run: |
          set -euo pipefail
          echo "9f83ea9f80bdc4b8aa5a8830d3b5ae0962066250a20f904f30728b089fc39f13  .release-v28/background.patch" | sha256sum -c -
          echo "fdb2c058a2006549946c421269b9c0388cd38573633d5058ded631d9d962f108  .release-v28/rest.patch" | sha256sum -c -
          git apply --check .release-v28/background.patch
          git apply --check .release-v28/rest.patch
          git apply .release-v28/background.patch
          git apply .release-v28/rest.patch
      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          python -m json.tool manifest.json >/dev/null
          python -m json.tool package.json >/dev/null
          git diff --check
          test "$(git hash-object README.md)" = "c95b28fc8196ae1dcbdfa0e4427eeef9287ddffd"
          test "$(git hash-object background.js)" = "a0fec1173ceed86895f9addf67a1c753c44678b7"
          test "$(git hash-object content.js)" = "236c54e98b43726dee49713634fc0c81aed8dc97"
          test "$(git hash-object manifest.json)" = "5af12b3d8ebc6f839cbb9361254d32874441dad4"
          test "$(git hash-object package.json)" = "3dce2e47419cb38b14db2b5a5f11921af4c88701"
          test "$(git hash-object tests/background.test.js)" = "e31b178d0a44cb34ce169cb8fe97f9809529c116"
          test "$(git hash-object tests/concurrent-scheduler.test.js)" = "dcda5d2bc2bcfe14b20c701566a1f2831d499c68"
          test "$(git hash-object tests/content.test.js)" = "ff4cd79f12c1a8cb3e4f2dd12d4c60039555e9de"
      - name: Commit validated release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-v28 .github/workflows/apply-v28.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AutoPrompter 2.8 with synchronized concurrent submission"
          git push origin HEAD:agent/synchronized-concurrent-submit
