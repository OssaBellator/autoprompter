name: Export Project Mode source

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/export-project-mode-source.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Package source
        run: tar --exclude=.git -czf /tmp/autoprompter-project-mode-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: autoprompter-project-mode-source
          path: /tmp/autoprompter-project-mode-source.tar.gz
          if-no-files-found: error
          retention-days: 1
