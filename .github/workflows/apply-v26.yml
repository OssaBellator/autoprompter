name: Apply AutoPrompter 2.6

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fresh-chat-interruption-retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fresh-chat-interruption-retry
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and verify patch blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB_SHA: b3425aefa7058f81adfc88dc06f08afffad7a5ec
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          sha = os.environ['PATCH_BLOB_SHA']
          req = urllib.request.Request(
              f"https://api.github.com/repos/OssaBellator/autoprompter/git/blobs/{sha}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)
          open('/tmp/autoprompter-v26.patch.xz', 'wb').write(base64.b64decode(payload['content']))
          PY
          echo "df83396768ad3f42f75fe87729c9bdcbdfc0f06d39c00011e0d7eabcc8b779ea  /tmp/autoprompter-v26.patch.xz" | sha256sum -c -
          xz -dc /tmp/autoprompter-v26.patch.xz > /tmp/autoprompter-v26.patch
          echo "1e6225eb722d526dec601fcb0b169dcb87f9d05526a1dc396927dfb2786d4a3b  /tmp/autoprompter-v26.patch" | sha256sum -c -
          git apply --check /tmp/autoprompter-v26.patch
          git apply /tmp/autoprompter-v26.patch
      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          python -m json.tool manifest.json >/dev/null
          python -m json.tool package.json >/dev/null
          git diff --check
          test "$(git hash-object background.js)" = "dc66aaf1ad007cb5f610bfd672064f0b943ef9ff"
          test "$(git hash-object content.js)" = "94b86c982ea9c74d65899f0651089ea917c4ab05"
          test "$(git hash-object popup.js)" = "e131b5c3feb1fed2156c0fe115b9aa6b2628cd5f"
          test "$(git hash-object manifest.json)" = "685de42cc170f8ffee1b293d3cc81f1a675574fa"
          test "$(git hash-object package.json)" = "9328df7c66b8c4c31e8be17b3f70d69e7c49ad91"
      - name: Commit validated release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-v26 .github/workflows/apply-v26.yml .github/v26.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AutoPrompter 2.6 with verified fresh chats and interruption retry"
          git push origin HEAD:agent/fresh-chat-interruption-retry
