name: Apply autonomous project bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/apply-autonomous-project-bootstrap.yml'
      - '.autonomous-project-bootstrap-trigger'

permissions:
  contents: write

concurrency:
  group: autonomous-project-bootstrap
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/autonomous-project-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/autonomous-project-bootstrap
          fetch-depth: 0

      - name: Reconstruct verified source patch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/autonomous-bootstrap.patch.gz.b64
          index=0
          for sha in \
            1ca7ef972d764a69017a8dfc63f9be9dc3401ea8 \
            99d1a96977a7e663168b5f4d680cd9b5a97d357c \
            5f2303094fcd35a7e8f09c82b3a703eefac2c6da \
            f4899b513588824c93952fb22bd618023a489dde \
            7bf9ccf1c5823954c1c92952c3f286fe3707573d \
            d507cc84d4b13c2ebe2c0898946e3051271ca074 \
            9cf0cf11ac3625365817a5631843d69c415d7f0c \
            05e08839f611c01bbf6dfd6a7c0f82ea53371641 \
            83b2dbc4e5a1858e1770708e67918bca8b482bdc \
            76fea7bc471fc380a4e4aa764795cda62c62491d \
            ce11c16030c5043f421c01a94bc63240629b0194 \
            e7f7e90c41be9ce03ea83edd1b70c0e5d31ecd09 \
            f7bb6c36af43aa0472fb3b56419df06e701fce62 \
            3a57df71b8ad586d27dc871d0a9e31bc804e3130
          do
            part=$(printf '/tmp/apb-part-%03d' "$index")
            python - "$sha" "$part" <<'PY'
          import base64, json, os, sys, urllib.request
          sha, output = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs/{sha}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          data = base64.b64decode(payload["content"])
          with open(output, "wb") as handle:
              handle.write(data)
          PY
            test "$(git hash-object "$part")" = "$sha"
            cat "$part" >> /tmp/autonomous-bootstrap.patch.gz.b64
            index=$((index + 1))
          done
          echo 'a12bd3312ddc25973dc91db8aeb05a9aad0eb674a22456ef678214b42e4f855f  /tmp/autonomous-bootstrap.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/autonomous-bootstrap.patch.gz.b64 > /tmp/autonomous-bootstrap.patch.gz
          echo 'e30ef92be0c1b4ea177fe0503135832948bec26b6d41340dc39a0d0e569228c1  /tmp/autonomous-bootstrap.patch.gz' | sha256sum --check
          gzip -dc /tmp/autonomous-bootstrap.patch.gz > /tmp/autonomous-bootstrap.patch
          echo 'c3ac3fd9d3c98782a896bb6262b868a23b5fe44db0ddd05c9733d7f3ba0e213e  /tmp/autonomous-bootstrap.patch' | sha256sum --check

      - name: Apply exact source
        run: |
          set -euo pipefail
          git apply --3way /tmp/autonomous-bootstrap.patch
          git diff --check
          test ! -e .autonomous-project-bootstrap-trigger
          test ! -e .github/workflows/export-autonomous-project-bootstrap.yml

      - name: Validate autonomous bootstrap
        run: |
          set -euo pipefail
          npm test
          npm run check
          python - <<'PY'
          import json
          from pathlib import Path
          for root in (Path('schemas'), Path('examples')):
              if root.exists():
                  for path in root.rglob('*.json'):
                      json.loads(path.read_text(encoding='utf-8'))
          manifest = json.loads(Path('manifest.json').read_text())
          package = json.loads(Path('package.json').read_text())
          assert manifest['version'] == '3.0.0'
          assert package['version'] == '3.0.0'
          PY
          grep -q 'START_PROJECT_BOOTSTRAP' background.js
          grep -q 'RUN_PROJECT_BOOTSTRAP_JOB' content.js
          grep -q 'MAX_PROJECT_BOOTSTRAP_REPAIRS = 3' background.js
          grep -q 'Create and bootstrap project' popup.html
          grep -q 'autonomous bootstrap creates role chats, repairs malformed planner JSON' tests/project-runtime.test.js

      - name: Verify exact source blobs and diff
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            test "$(git hash-object "$path")" = "$expected"
          done <<'EOF'
          5e82570d607383b772646dfe02c10b6549b8d8a5 README.md
          57d0cf993722380049ba4bb52a5f3e1e506fe316 background.js
          37583ef637d61c3bf74f020c873c74988aea3707 content.js
          0371eac49aa9bf416638e5b2e081a11598cd244b docs/AUTONOMOUS_BOOTSTRAP_PLAN.md
          1a25273e3ffe3dd09ca5030642a93582367614f7 docs/PROJECT_MODE_STATUS.md
          2e2c0dfaa7191a9576b736f522c81e79238af5d8 manifest.json
          4694e202f1c3bebd3beeb4777d7372f9f6b8b5a7 package.json
          e7bc07022abaf9b7e5744aad94eae1733261ef68 planner-protocol.js
          f7493b72b0600fc3aa603dc05dcbbc1c59132160 popup.html
          fcc08c86d94ba0f8f4b7ffe0881b5523ff606fbd popup.js
          eda5f43cfaa4b2dff0e0f4b0564e1b282076cf23 project-store.js
          3699e65ac1fac0962dbc0a3944a990a85ee85402 tests/project-autonomous-bootstrap.test.js
          65410d2a73dad57a34fb8b8ee6a68aaaec48bb1e tests/project-runtime.test.js
          EOF
          git diff --name-status | sort > /tmp/actual-files
          cat > /tmp/expected-files <<'EOF'
          D	.autonomous-project-bootstrap-trigger
          D	.github/workflows/export-autonomous-project-bootstrap.yml
          M	README.md
          M	background.js
          M	content.js
          M	docs/AUTONOMOUS_BOOTSTRAP_PLAN.md
          M	docs/PROJECT_MODE_STATUS.md
          M	manifest.json
          M	package.json
          M	planner-protocol.js
          M	popup.html
          M	popup.js
          M	project-store.js
          A	tests/project-autonomous-bootstrap.test.js
          M	tests/project-runtime.test.js
          EOF
          sort /tmp/expected-files -o /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit validated source only
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-autonomous-project-bootstrap.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Automate Project Mode role chats and planner bootstrap'
          git push origin HEAD:feature/autonomous-project-bootstrap
