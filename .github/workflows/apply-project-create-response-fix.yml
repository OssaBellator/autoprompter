name: Apply project creation response fix

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - '.project-create-response-fix-trigger'
      - '.github/workflows/apply-project-create-response-fix.yml'

permissions:
  contents: write

concurrency:
  group: project-create-response-fix
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/project-create-response'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-create-response
          fetch-depth: 0

      - name: Apply exact source edits
        shell: bash
        run: |
          set -euo pipefail
          test -f .project-create-response-fix-trigger
          python - <<'PY'
          from pathlib import Path

          popup = Path('popup.js')
          text = popup.read_text(encoding='utf-8')
          old_runtime = '''async function runtimeMessage(type, extra = {}) {
            return chrome.runtime.sendMessage({ scope: MESSAGE_SCOPE, type, ...extra });
          }
          '''
          new_runtime = '''async function runtimeMessage(type, extra = {}) {
            const response = await chrome.runtime.sendMessage({ scope: MESSAGE_SCOPE, type, ...extra });
            if (!response || typeof response !== "object") {
              throw new Error("AutoPrompter's background service did not return a valid response. Reload the extension and refresh ChatGPT tabs.");
            }
            return response;
          }

          function resolveCreatedProject(response) {
            const projects = Array.isArray(response?.projects) ? response.projects : [];
            const directProject = response?.project && typeof response.project === "object" ? response.project : null;
            const projectId = String(directProject?.projectId || response?.activeProjectId || "").trim();
            if (!projectId) {
              throw new Error("Project creation did not return a project ID. Reload AutoPrompter at edge://extensions, refresh ChatGPT tabs, and try again.");
            }
            const project = directProject || projects.find(item => item?.projectId === projectId) || null;
            return { projectId, project, projects };
          }
          '''
          if old_runtime not in text:
              raise SystemExit('popup runtimeMessage source did not match expected baseline')
          text = text.replace(old_runtime, new_runtime, 1)

          old_create = '''  projectState.projects = response.projects || [];
            projectState.activeProjectId = response.activeProjectId;
            projectState.project = response.project;
            projectState.events = [];
            elements.projectSelect.value = response.project.projectId;
            elements.projectMessage.textContent = `Created ${response.project.projectId}. No chats were dispatched.`;
            await inspectProject(response.project.projectId);
          '''
          new_create = '''  const created = resolveCreatedProject(response);
            projectState.projects = created.projects;
            projectState.activeProjectId = created.projectId;
            projectState.project = created.project;
            projectState.events = [];
            elements.projectMessage.textContent = `Created ${created.projectId}. No chats were dispatched.`;
            await inspectProject(created.projectId);
          '''
          if old_create not in text:
              raise SystemExit('popup createProjectDraft source did not match expected baseline')
          popup.write_text(text.replace(old_create, new_create, 1), encoding='utf-8')

          background = Path('background.js')
          text = background.read_text(encoding='utf-8')
          old_unknown = '''      default:
                return { running: false, status: "Unknown command" };
          '''
          new_unknown = '''      default:
                throw new Error(`Unknown AutoPrompter runtime command: ${String(message.type || "missing")}`);
          '''
          if old_unknown not in text:
              raise SystemExit('background unknown-command source did not match expected baseline')
          background.write_text(text.replace(old_unknown, new_unknown, 1), encoding='utf-8')

          Path('tests/project-create-response.test.js').write_text(r'''"use strict";

          const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const Store = require("../project-store.js");

          const root = path.join(__dirname, "..");
          const popupJs = fs.readFileSync(path.join(root, "popup.js"), "utf8");
          const backgroundJs = fs.readFileSync(path.join(root, "background.js"), "utf8");

          test("project creation accepts the full GitHub .git URL and returns an ID", () => {
            const result = Store.createProject(Store.emptyStore(), {
              title: "Autoprompter",
              goal: "Build a web-first multi-agent framework.",
              repository: "https://github.com/OssaBellator/autoprompter.git",
              plannerChatId: "planner",
              reviewerChatId: "reviewer",
              integratorChatId: "integrator",
              workerChatIds: []
            }, () => Date.parse("2026-08-01T04:00:00.000Z"));
            assert.equal(result.project.projectId, "autoprompter");
            assert.equal(result.project.repository.slug, "OssaBellator/autoprompter");
            assert.equal(result.store.activeProjectId, result.project.projectId);
          });

          test("popup resolves a created project from activeProjectId without dereferencing a missing project", () => {
            assert.match(popupJs, /function resolveCreatedProject\(response\)/);
            assert.match(popupJs, /directProject\?\.projectId \|\| response\?\.activeProjectId/);
            assert.match(popupJs, /await inspectProject\(created\.projectId\)/);
            assert.doesNotMatch(popupJs, /response\.project\.projectId/);
            assert.match(popupJs, /Reload AutoPrompter at edge:\/\/extensions/);
          });

          test("unknown runtime commands fail instead of returning a successful-looking response", () => {
            assert.match(backgroundJs, /throw new Error\(`Unknown AutoPrompter runtime command:/);
            assert.doesNotMatch(backgroundJs, /return \{ running: false, status: "Unknown command" \}/);
          });
          ''', encoding='utf-8')
          PY
          git diff --check

      - name: Validate fix
        run: |
          set -euo pipefail
          npm test
          npm run check

      - name: Commit validated source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .project-create-response-fix-trigger
          rm -f .github/workflows/apply-project-create-response-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Project Mode creation response handling'
          git push origin HEAD:fix/project-create-response
