name: Apply Project Mode Frontiers

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.frontiers-trigger'
      - '.m5/overlay-recovery.patch'
      - '.github/workflows/apply-project-mode-frontiers.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/web-first-multi-agent-project-mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-first-multi-agent-project-mode
          fetch-depth: 0

      - name: Reconstruct immutable frontier payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          shas=(
            830439321431758be980ae6e78db09625649fb2c
            b65acd36f32c2efc93774906b2d8c49095976f51
            51d4dd56dde93f66aaa9193b4827e0a9c2f6082d
            70e28f095b850c58c11e7a2aba0ba28604fc0dd1
            449c650c6fc53a65b636f4a5488e7af0aba9bb7c
            f5566bdc1feb71217d3eeb31b256b20ec2d5cb3b
            143a3c9dad6551ffb817d691d010f6ca88d73461
            e17ae44b54f1fe60d942f144e157c60f948a76c9
            88cfff44fd3dbf9ee761bf217b234db52abf2d2e
            f984e932feadc760528382c13e34087d26b202ff
            339e4dba006bb726ee4ebb6f4067995da129e990
            4d7f14419128cc431136d3f4fa624b087a5ccbba
            c0127aa72047dec6f900d9d853d8d8612039993d
            e830e8dc933d0c4b0be859072ca452a1f14b8b18
            7e5f38f013aa8a23fdcb5ad125919fb35e02c5e1
            16f13f65c994b5ac2c64706099237e2e7f164f40
            11a07ccf597b251832f9f877e03591533a139ae8
            28894c557cb281fe2e8916835e162c8405b7b4dc
            f03e8f783455103e9c65d4516053db79262a0b6c
          )
          mkdir -p /tmp/frontier-chunks .m5
          index=0
          for sha in "${shas[@]}"; do
            output=$(printf '/tmp/frontier-chunks/%03d' "$index")
            python - "$sha" "$output" <<'PY'
          import base64, json, os, sys, urllib.request
          sha, output = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/git/blobs/{sha}",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          data = base64.b64decode(payload["content"])
          with open(output, "wb") as handle:
              handle.write(data)
          PY
            actual=$(git hash-object "$output")
            test "$actual" = "$sha"
            index=$((index + 1))
          done
          cat /tmp/frontier-chunks/* > /tmp/frontier-payload.b64
          base64 --decode /tmp/frontier-payload.b64 > /tmp/frontier-payload.tar.gz
          echo 'e89a7043441567f150b55e89fb1ecb92eb153fec2d31dcdb9f953634a6d48d0c  /tmp/frontier-payload.tar.gz' | sha256sum --check
          tar -xzf /tmp/frontier-payload.tar.gz -C .m5
          test -f .m5/apply_frontiers.py
          test -f .m5/overlay-recovery.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('.m5/apply_frontiers.py')
          text = path.read_text(encoding='utf-8')
          old = '''    count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)'''
          new = '''    count = text.count(old)
              if label == "popup inspect frontier assignment" and count == 2:
                  return text.replace(old, new)
              if label in {"status safety and next", "README project mode summary"} and count == 0:
                  return text
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)'''
          if old not in text:
              raise SystemExit('publication assertion function did not match')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .m5/apply_frontiers.py
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/PROJECT_MODE_STATUS.md')
          text = path.read_text(encoding='utf-8')
          old = '''Planner and worker prompts are generated for manual use. Starting a project changes only extension-local state. Preparing assignments does not open tabs, send ChatGPT messages, write repositories, run task commands, or claim that a worker executed anything. Active leases are local coordination records and expire automatically.

          ## Milestone 4 validation

          The lease-preparation milestone passed 82 automated tests, JavaScript syntax checks, JSON validation, patch-integrity checks, and exact Git blob verification before its source commit was created.

          ## Next milestone

          Add strict `AUTOPROMPTER_TASK_RESULT_BEGIN` / `AUTOPROMPTER_TASK_RESULT_END` parsing, dispatch/result identity checks, verification-evidence validation, and explicit reviewer acceptance or bounded revision decisions. Live worker submission remains disabled until result handling and recovery are complete.
          '''
          new = '''Planner, reviewer, and integrator prompts can still be copied manually. Live worker dispatch is opt-in and requires the user to verify each worker chat's model first. AutoPrompter never selects a model, merges to the default branch, publishes, changes permissions, rotates accounts, or bypasses platform restrictions. Worker results require independent review, and integration requires explicit completion approval.

          ## Frontier validation

          The result, review, integration, web-dispatch, and recoverable-overlay frontiers are validated together before any source commit is created.

          ## Next milestone

          Add integrator-side conflict/retry handling, explicit approval queues for merge/release actions, durable repository reconciliation after browser restart, and stronger live-dispatch recovery for context-limit successors without weakening identity checks.
          '''
          if old not in text:
              raise SystemExit('current status section did not match')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_summary = '- Draft Project Mode foundation on the development branch: versioned local project storage, fixed planner/reviewer/integrator roles, strict planner-envelope validation, approval-gated task creation, deterministic worker leases, bounded local assignment preparation, restart recovery, and an audit trail. Prepared worker prompts remain local and are not sent automatically.'
          new_summary = '- Draft Project Mode on the development branch: strict planner/result/reviewer/integration envelopes, deterministic worker leases, bounded revisions, dependency progression, explicit completion approval, and opt-in ChatGPT Web worker dispatch after manual model verification. It does not automate model selection or merge/publish actions.'
          if old_summary not in readme:
              raise SystemExit('current README Project Mode summary did not match')
          readme = readme.replace(old_summary, new_summary, 1)
          old_interruption = '- **Connection interrupted:** stop the interrupted generation when a stop control is available, then queue a same-chat continuation prompt without incrementing completed-work progress. Retries are capped at three consecutive attempts.'
          new_interruption = '- **Recoverable generation interruption:** for `Connection interrupted. Waiting for the complete answer` and the non-selectable `Our systems are thinking a bit more... retry with a faster model` overlay, stop the current generation when possible and queue a same-chat continuation prompt without incrementing completed-work progress. Retries are capped at three consecutive attempts.'
          if old_interruption not in readme:
              raise SystemExit('current README interruption bullet did not match')
          readme_path.write_text(readme.replace(old_interruption, new_interruption, 1), encoding='utf-8')
          PY
          git apply --check .m5/overlay-recovery.patch
          git apply .m5/overlay-recovery.patch

      - name: Validate all active frontiers
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          python - <<'PY'
          import json
          from pathlib import Path
          for root in (Path('schemas'), Path('examples')):
              if not root.exists():
                  continue
              for path in root.rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
          PY
          git diff --check
          test -f result-protocol.js
          test -f reviewer-protocol.js
          test -f integration-protocol.js
          grep -q 'AUTOPROMPTER_TASK_RESULT_BEGIN' result-protocol.js
          grep -q 'AUTOPROMPTER_REVIEW_BEGIN' reviewer-protocol.js
          grep -q 'AUTOPROMPTER_INTEGRATION_BEGIN' integration-protocol.js
          grep -q 'RUN_PROJECT_TASK' content.js
          grep -q 'DISPATCH_PROJECT_ASSIGNMENTS' background.js
          grep -q 'modelVerified' background.js
          grep -q 'STORE_SCHEMA_VERSION = "1.4"' project-store.js
          grep -q 'our systems are thinking a bit more about this request' content.js
          grep -q 'non-selectable retry overlay is discovered' tests/content.test.js

      - name: Commit validated frontier source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .m5 .frontiers-trigger .github/workflows/apply-project-mode-frontiers.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Advance Project Mode frontiers and recover extended-thinking overlays'
          git push origin HEAD:agent/web-first-multi-agent-project-mode
