name: Apply AutoPrompter 2.2 on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/per-chat-continuity-init'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/per-chat-continuity-init
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and apply tested patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          lines = Path('.github/workflows/apply-v22.yml').read_text(encoding='utf-8').splitlines()
          starts = [index for index, line in enumerate(lines) if "<<'PAYLOAD'" in line]
          if len(starts) != 1:
              raise SystemExit(f'Expected one PAYLOAD opener, found {len(starts)}')
          start = starts[0]
          ends = [index for index in range(start + 1, len(lines)) if lines[index].strip() == 'PAYLOAD']
          if len(ends) != 1:
              raise SystemExit(f'Expected one PAYLOAD closer, found {len(ends)}')
          payload = ''.join(line.strip() for line in lines[start + 1:ends[0]])
          decoded = base64.b64decode(payload, validate=True)
          if not decoded.startswith(b'\x1f\x8b'):
              raise SystemExit('Decoded payload is not gzip data')
          Path('/tmp/v22.patch.gz').write_bytes(decoded)
          PY
          gzip -dc /tmp/v22.patch.gz > /tmp/v22.patch
          patch -p1 < /tmp/v22.patch
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Commit validated release
        shell: bash
        run: |
          rm -f .github/workflows/apply-v22.yml .github/workflows/run-v22.yml .github/workflows/pr-apply-v22.yml .github/v22.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AutoPrompter 2.2 with per-chat continuity"
          git push origin HEAD:agent/per-chat-continuity-init
