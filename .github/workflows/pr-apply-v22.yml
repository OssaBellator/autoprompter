name: Apply AutoPrompter 2.2 on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/per-chat-continuity-init'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/per-chat-continuity-init
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract and apply tested patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/apply-v22.yml').read_text(encoding='utf-8').splitlines()
          markers = [index for index, line in enumerate(lines) if line.strip() == 'PAYLOAD']
          if len(markers) != 2:
              raise SystemExit(f'Expected two PAYLOAD markers, found {len(markers)}')
          payload = ''.join(line.strip() for line in lines[markers[0] + 1:markers[1]])
          if not payload:
              raise SystemExit('Patch payload was empty')
          Path('/tmp/v22.patch.gz.b64').write_text(payload + '\n', encoding='ascii')
          PY
          base64 -d /tmp/v22.patch.gz.b64 | gzip -d > /tmp/v22.patch
          patch -p1 < /tmp/v22.patch
      - name: Validate
        run: |
          npm test
          npm run check
      - name: Commit validated release
        shell: bash
        run: |
          rm -f .github/workflows/apply-v22.yml .github/workflows/run-v22.yml .github/workflows/pr-apply-v22.yml .github/v22.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AutoPrompter 2.2 with per-chat continuity"
          git push origin HEAD:agent/per-chat-continuity-init
