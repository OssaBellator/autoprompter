name: Apply role handoff bridge

on:
  push:
    branches:
      - feature/automatic-review-integration-handoffs

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/automatic-review-integration-handoffs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Expose guarded content runner
        run: node scripts/expose-content-runner.js
      - name: Validate generated runtime
        run: |
          npm test
          npm run check
      - name: Remove transformation machinery
        run: |
          rm scripts/expose-content-runner.js
          rm .github/workflows/apply-role-handoff-bridge.yml
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Connect automatic reviewer and integrator role jobs"
          git pull --rebase origin feature/automatic-review-integration-handoffs
          git push origin HEAD:feature/automatic-review-integration-handoffs
