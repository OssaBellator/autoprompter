name: Apply Project Mode Milestone 3

on:
  pull_request:
    paths:
      - ".m3/**"
      - ".github/workflows/apply-project-mode-m3.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .m3/part-* > .m3/patch.b64
          base64 --decode .m3/patch.b64 > .m3/patch.gz
          echo "0e5b92d9b847d25247c05f3b22a046b933d1a3882bcf510bb623fed985ac84d1  .m3/patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout .m3/patch.gz > .m3/milestone3.patch
          echo "40b1131be9f4f383586d3a9882e87e9d0fb466666b838638c63cb8b6436350b7  .m3/milestone3.patch" | sha256sum --check --strict
          git apply --check .m3/milestone3.patch
          git apply .m3/milestone3.patch

      - name: Run test suite
        run: npm test

      - name: Run syntax checks
        run: npm run check

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const roots = ['schemas', 'examples'];
          const files = ['manifest.json', 'package.json'];
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.json')) files.push(full);
            }
          }
          for (const root of roots) walk(root);
          for (const file of files) JSON.parse(fs.readFileSync(file, 'utf8'));
          console.log(`Validated ${files.length} JSON files.`);
          NODE

      - name: Verify diff and exact blobs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          check_blob() {
            expected="$1"
            file="$2"
            actual="$(git hash-object "$file")"
            test "$actual" = "$expected" || {
              echo "Blob mismatch for $file: expected $expected, got $actual" >&2
              exit 1
            }
          }
          check_blob ce5832c95947c55e6e44a8a1e3a542edfc30bb12 README.md
          check_blob cd61b758c0981ac5de73b3f018da26b923a28dad background.js
          check_blob e96a4efcf7cde983fad490449c8dae18dc63c6fb docs/RFC-001-WEB-FIRST-MULTI_AGENT_RUNTIME.md
          check_blob 363b141f6b8f083bba5ff6de9ee4ee05716d456e examples/sample-project/.autoprompter/plan.json
          check_blob d629ac27cd0528c6f2b0e4bee9dfa1fcdc323ac3 package.json
          check_blob 86877a1c5fd0991b555152621aa8b9c0bbcc9eb7 planner-protocol.js
          check_blob 142de971a8132e5c23aa5599fd56a856335d36cf popup.css
          check_blob 4310bcaa008738c734f4faf196f81a3fec86dbcd popup.html
          check_blob 170e71c7834e733e5df6141ed16947a198864f53 popup.js
          check_blob 9f1f55a5ac68d7b93a93116453a80280aafcb89a project-store.js
          check_blob 3d4fa5a6a6c3b59078f4b90f77b629aaf55ab9b0 schemas/plan.schema.json
          check_blob 43cc90fb3aad20727d6e2b13f42efd470073a048 tests/planner-protocol.test.js
          check_blob adb41fa7952d4c09bc8aa92d0bb57e28ace85abf tests/popup-source.test.js
          check_blob d10347aa6dd2e74fb6d6c0a77ebd6a178a40b5d4 tests/project-protocol.test.js
          check_blob 2fe5086b11f671ca23dac736f2ca0e7bd1ed94f2 tests/project-runtime.test.js
          check_blob 2275639a7c1b7934254c33a162d73a9d7e5783af tests/project-store.test.js

      - name: Commit validated milestone
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .m3
          rm .github/workflows/apply-project-mode-m3.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add approval-gated planner protocol"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
