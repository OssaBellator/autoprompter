name: Apply AutoPrompter 2.7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/maximum-length-successor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/maximum-length-successor
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply assertion-checked source edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              file.write_text(text.replace(old, new, 1))

          old = '''    const connectionInterrupted = /connection interrupted\\.?\\s*waiting for the complete answer\\.?$/i;
              if ((source === "notice" && /^connection interrupted\\.?\\s*waiting for the complete answer\\.?$/i.test(candidate)) ||
                  (source === "assistant" && connectionInterrupted.test(candidate))) {
                return { kind: "connection_interrupted", message: text.slice(-500) };
              }
          '''
          new = '''    const connectionInterrupted = /connection interrupted\\.?\\s*waiting for the complete answer\\.?$/i;
              if ((source === "notice" && /^connection interrupted\\.?\\s*waiting for the complete answer\\.?$/i.test(candidate)) ||
                  (source === "assistant" && connectionInterrupted.test(candidate))) {
                return { kind: "connection_interrupted", message: text.slice(-500) };
              }

              // ChatGPT's current maximum-length notice differs from the older
              // "conversation too long" variants. Match the complete platform-shaped
              // sentence, including straight and curly apostrophes. Assistant matching
              // also permits the notice to be appended after a partial response.
              const maximumLengthNotice = /you(?:['’]ve| have) reached the maximum length for this conversation(?:,\\s*but you can keep talking by starting a new chat)?\\.?$/i;
              if ((source === "notice" && /^you(?:['’]ve| have) reached the maximum length for this conversation(?:,\\s*but you can keep talking by starting a new chat)?(?:[.!]|\\s|$)/i.test(candidate)) ||
                  (source === "assistant" && maximumLengthNotice.test(candidate))) {
                return { kind: "context_limit", message: text.slice(-500) };
              }
          '''
          replace_once('content.js', old, new)

          test_file = Path('tests/content.test.js')
          test_text = test_file.read_text().rstrip()
          block = '''

          test("current maximum-length wording triggers context rollover", () => {
            const exact = "You've reached the maximum length for this conversation, but you can keep talking by starting a new chat.";
            assert.equal(classifyGuardrailText(exact, "notice").kind, "context_limit");
            assert.equal(
              classifyGuardrailText("You’ve reached the maximum length for this conversation, but you can keep talking by starting a new chat.", "notice").kind,
              "context_limit"
            );
            assert.equal(
              classifyGuardrailText(`Partial answer before the limit. ${exact}`, "assistant").kind,
              "context_limit"
            );
            assert.equal(
              classifyGuardrailText("The documentation quotes a maximum-length warning for testing.", "assistant"),
              null
            );
          });
          '''
          if 'current maximum-length wording triggers context rollover' in test_text:
              raise SystemExit('tests/content.test.js: regression test already exists')
          test_file.write_text(test_text + block)

          replace_once(
              'tests/concurrent-scheduler.test.js',
              'message: "This conversation is too long."',
              'message: "You\\'ve reached the maximum length for this conversation, but you can keep talking by starting a new chat."'
          )

          for path in ['manifest.json', 'package.json', 'README.md', 'tests/background.test.js', 'tests/concurrent-scheduler.test.js']:
              replace_once(path, '2.6.0', '2.7.0')

          replace_once(
              'README.md',
              '\nAutoPrompter is a Microsoft Edge / Chromium Manifest V3 extension',
              '\n- Detects ChatGPT’s current maximum-length notice and opens a best-effort successor even when no repository checkpoint exists.\n\nAutoPrompter is a Microsoft Edge / Chromium Manifest V3 extension'
          )
          replace_once(
              'README.md',
              '- **Context limit:** use a verified repository handoff when possible. If the context-limit message arrives before a checkpoint can be created, open a best-effort fresh chat using the selected chat title, configured work prompt, and any repository details. The extension explicitly tells the new chat that it cannot see the old transcript.',
              '- **Context limit:** use a verified repository handoff when possible. The detector includes `You’ve reached the maximum length for this conversation, but you can keep talking by starting a new chat.` If the context-limit message arrives before a checkpoint can be created, open a best-effort fresh chat using the selected chat title, configured work prompt, and any repository details. The extension explicitly tells the new chat that it cannot see the old transcript.'
          )
          PY
      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          python -m json.tool manifest.json >/dev/null
          python -m json.tool package.json >/dev/null
          git diff --check
          test "$(git hash-object content.js)" = "c048687cad8b05c86f226f6c1e03d4cdd0aec99d"
          test "$(git hash-object manifest.json)" = "83f53d586c772b0746a0e30d7266b2436adb3a71"
          test "$(git hash-object package.json)" = "f5eed198a2c919350699bffe6c8685a25b5cc188"
          test "$(git hash-object README.md)" = "fc4b683343a2d88094c6a7ae535ee2e2e98563cc"
          test "$(git hash-object tests/content.test.js)" = "1d85d5dec7dad7e6b319a93bf68dd2efbebd5d97"
          test "$(git hash-object tests/concurrent-scheduler.test.js)" = "0ad034775c5bc7ac4a950bbbed68a4abbe101dec"
          test "$(git hash-object tests/background.test.js)" = "898011b9c35217f53cce2544b707d168129165e0"
      - name: Commit validated release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-v27.yml .github/v27.ready
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AutoPrompter 2.7 with current maximum-length rollover"
          git push origin HEAD:agent/maximum-length-successor
